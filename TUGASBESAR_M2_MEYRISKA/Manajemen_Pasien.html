<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Pasien</title>

    <link rel="stylesheet" href="display.css">
</head>

<body>

    <h1>Sistem Informasi Klinik Rawat Jalan</h1>

    <h2>Form Input Data Pasien</h2>

    <form>

        <h3>1. Profil Pasien</h3>

        <label>Nama Lengkap Pasien:</label>
        <input type="text">
        <br><br>

        <label>NIK:</label>
        <input type="text">
        <br><br>

        <label>Tanggal Lahir:</label>
        <input type="text">
        <br><br>

        <label>Jenis Kelamin:</label>
        <input type="text">
        <br><br>

        <label>Nomor HP:</label>
        <input type="tel">
        <br><br>

        <h3>2. Nomor Rekam Medis Dasar</h3>

        <label>Nomor Rekam Medis:</label>
        <input type="text">
        <br><br>

        <h3>3. Domisili Pasien</h3>

        <label>Alamat / Domisili:</label>
        <br>
        <textarea rows="4" cols="40"></textarea>
        <br><br>

        <h3>4. Kontak Darurat</h3>

        <label>Nama Kontak Darurat:</label>
        <input type="text">
        <br><br>

        <label>Nomor Kontak Darurat:</label>
        <input type="tel">
        <br><br>

        <button type="submit">Simpan</button>

    </form>

</body>
</html>
